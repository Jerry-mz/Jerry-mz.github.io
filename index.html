<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基础文件测试接口</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background-color: #f5f5f7; 
            margin: 0; 
        }
        .container { 
            background: white; 
            padding: 40px; 
            border-radius: 16px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
            text-align: center; 
        }
        .btn { 
            display: inline-block; 
            min-width: 160px;
            padding: 14px 28px; 
            margin: 15px; 
            font-size: 16px; 
            font-weight: 600; 
            color: white; 
            background-color: #0071e3; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            text-decoration: none; 
            transition: background 0.2s;
        }
        .btn:hover { background-color: #0077ed; }
        .btn-download { background-color: #34c759; }
        .btn-download:hover { background-color: #30b651; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. 上传按钮（触发电脑本地文件选择框） -->
        <label class="btn">
            上传文件
            <input type="file" onchange="alert('已选中文件: ' + this.files[0].name + '\n本地前端捕获成功！')">
        </label>

        <!-- 2. 下载按钮（直接下载一个纯文本测试文件） -->
        <a href="data:text/plain;charset=utf-8,SUCCESS%3A%20File%20download%20works%20perfectly." 
           download="车机下载测试.txt" 
           class="btn btn-download">
            下载文件
        </a>
    </div>

</body>
</html>
